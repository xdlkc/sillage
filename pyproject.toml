[project]
name = "llm-blindtest"
version = "0.1.0"
description = "Blinded model-family identification through a pi provider"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-blindtest = "llm_blindtest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
llm_blindtest = ["prompts.json"]
